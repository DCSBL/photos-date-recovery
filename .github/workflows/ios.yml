# iOS checks: build the app once, then run every test job in parallel against that build.
#
# `build` compiles the app, PhtofxrTests and PhtofxrUITests with `xcodebuild build-for-testing` for the
# simulator and uploads Build/Products as the `test-products` artifact. The test jobs download it and run
# `xcodebuild test-without-building`, so the app is compiled once per run. A compile error shows up in `build`
# and the test jobs never start. Compiler warnings and errors become PR annotations through
# .github/xcode-problem-matcher.json.
#
# The `xcode-27` runner image has Xcode 27.2 with iOS 27.2 simulators, including iPhone Duo; the older
# `macos-26` image has no Xcode 27. Nothing here signs, archives or uploads.

name: iOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    name: Build for testing
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          swift --version

      # arm64 only: the simulators on these runners are Apple silicon, so an x86_64 slice doubles compile time for nothing.
      - name: xcodebuild build-for-testing
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-matcher::.github/xcode-problem-matcher.json"
          xcodebuild build-for-testing \
            -project Phtofxr.xcodeproj \
            -scheme Phtofxr \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build.log

      # tar keeps the executable bits and symlinks inside the .app bundles, which a plain artifact upload drops.
      - name: Pack test products
        shell: bash
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/DerivedData/Build/Products"
          ls "$products"
          tar -C "$products" --exclude='*.swiftmodule' --exclude='*.dSYM' -cf test-products.tar .
          du -h test-products.tar

      - name: Upload test products
        uses: actions/upload-artifact@v7
        with:
          name: test-products
          path: test-products.tar
          compression-level: 1
          retention-days: 1

      - name: Upload build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

  core-macos:
    name: PhtofxrCore tests (macOS)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: swift test
        working-directory: PhtofxrCore
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-matcher::.github/xcode-problem-matcher.json"
          swift test 2>&1 | tee swift-test.log

  iphone:
    name: Tests (iPhone 17)
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}

      - name: Prepare simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Products"
          tar -C "$RUNNER_TEMP/Products" -xf "$RUNNER_TEMP/test-products.tar"
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"
          udid="$(python3 scripts/ci/pick_simulator.py "iPhone 17")"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      - name: App tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:PhtofxrTests \
            -resultBundlePath app-tests.xcresult \
            2>&1 | tee app-tests.log

      - name: UI tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:PhtofxrUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath ui-tests.xcresult \
            2>&1 | tee ui-tests.log

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: iphone-results
          path: |
            app-tests.log
            ui-tests.log
            app-tests.xcresult
            ui-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  duo:
    name: UI tests (iPhone Duo)
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}

      - name: Prepare simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Products"
          tar -C "$RUNNER_TEMP/Products" -xf "$RUNNER_TEMP/test-products.tar"
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"
          udid="$(python3 scripts/ci/pick_simulator.py "iPhone Duo")"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      - name: UI tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:PhtofxrUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath duo-ui-tests.xcresult \
            2>&1 | tee duo-ui-tests.log

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: duo-results
          path: |
            duo-ui-tests.log
            duo-ui-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Real PhotoKit: photos with known names in the simulator's library. Not required until it has proved stable.
  integration:
    name: PhotoKit integration (simulator)
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}

      - name: Prepare simulator with photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Products"
          tar -C "$RUNNER_TEMP/Products" -xf "$RUNNER_TEMP/test-products.tar"
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"
          udid="$(python3 scripts/ci/pick_simulator.py "iPhone 17")"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          bash scripts/ci/seed-simulator-photos.sh "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      - name: PhotoKit integration tests
        shell: bash
        env:
          # xcodebuild hands TEST_RUNNER_-prefixed variables to the tests without the prefix.
          TEST_RUNNER_PHTOFXR_SEEDED: "1"
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:PhtofxrTests/PhotoKitIntegrationTests \
            -resultBundlePath integration.xcresult \
            2>&1 | tee integration.log
          grep "PHTOFXR" integration.log > photokit-report.txt || true
          {
            echo "### What PhotoKit reported"
            echo '```'
            cat photokit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: |
            integration.log
            photokit-report.txt
            integration.xcresult
          if-no-files-found: ignore
          retention-days: 7
