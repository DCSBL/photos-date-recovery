# Cancel a PR's still-running CI when it is merged: the merge commit gets its own runs on main, so finishing
# the PR's runs only occupies macOS runners. Runs keep going for PRs labelled `full-ci` or touching CI or the
# Xcode project.
#
# pull_request_target runs from the base branch and checks out no PR code; the head SHA and file list come
# from the API.

name: Cancel CI on merge

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  pull-requests: read
  contents: read

jobs:
  cancel:
    name: Cancel running CI
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel runs of the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if printf ',%s,' "$LABELS" | grep -q ',full-ci,'; then
            echo "Label full-ci: runs keep going."; exit 0
          fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate -q '.[].filename')"
          if printf '%s\n' "$files" | grep -Eq '^(Phtofxr\.xcodeproj/|scripts/ci/|\.github/workflows/)'; then
            echo "CI or project files changed: runs keep going."; exit 0
          fi
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=pull_request&per_page=100" \
            -q '.workflow_runs[] | select(.status != "completed") | .id')"
          for id in $ids; do
            echo "Cancelling run $id"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null || true
          done
